version: 2

models:
  - name: silver_users
    description: Limpeza e padronizacao da dimensao de usuarios.
    columns:
      - name: user_id
        description: Identificador do usuario.
        tests:
          - unique
      - name: user_name
        description: Nome do usuario sem espacos extras.
        tests:
          - not_null
      - name: email
        description: Email em minúsculas e sem espacos extras.
        tests:
          - not_null
          - unique
      - name: created_at
        description: Data de criacao convertida para timestamp.
        tests:
          - not_null
      - name: updated_at
        description: Data da ultima atualizacao convertida para timestamp.
        tests:
          - not_null
      - name: status
        description: Status padronizado em minusculas.
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive']

  - name: silver_courses
    description: Limpeza e padronizacao do catalogo de cursos.
    columns:
      - name: course_id
        description: Identificador do curso.
        tests:
          - not_null
          - unique
      - name: course_name
        description: Nome do curso sem espacos extras.
        tests:
          - not_null
      - name: area
        description: Area do curso sem espacos extras.
        tests:
          - not_null
      - name: created_at
        description: Data de criacao convertida para timestamp.
        tests:
          - not_null

  - name: silver_enrollments
    description: Limpeza e padronizacao das matriculas dos usuarios.
    columns:
      - name: enrollment_id
        description: Identificador da matricula.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Identificador do usuario matriculado.
        tests:
          - not_null
          - relationships:
              to: ref('silver_users')
              field: user_id
      - name: course_id
        description: Identificador do curso matriculado.
        tests:
          - not_null
          - relationships:
              to: ref('silver_courses')
              field: course_id
      - name: enrolled_at
        description: Data da matricula convertida para timestamp.
        tests:
          - not_null
      - name: status
        description: Status da matricula padronizado em minusculas.
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'cancelled']

  - name: silver_questions
    description: Limpeza e padronizacao das perguntas.
    columns:
      - name: question_id
        description: Identificador da pergunta.
        tests:
          - unique
      - name: discipline_name
        description: Nome da disciplina sem espacos extras.
        tests:
          - not_null
      - name: subject_name
        description: Nome do assunto sem espacos extras.
        tests:
          - not_null
      - name: difficulty
        description: Dificuldade convertida para decimal com duas casas.
        tests:
          - not_null
      - name: created_at
        description: Data de criacao convertida para timestamp.
        tests:
          - not_null

  - name: silver_answers
    description: Limpeza e padronizacao das respostas dos usuarios.
    columns:
      - name: answer_id
        description: Identificador da resposta.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Identificador do usuario que respondeu.
        tests:
          - relationships:
              to: ref('silver_users')
              field: user_id
      - name: question_id
        description: Identificador da pergunta respondida.
        tests:
          - not_null
          - relationships:
              to: ref('silver_questions')
              field: question_id
      - name: is_correct
        description: Indicador se a resposta estava correta.
        tests:
          - not_null
      - name: answered_at
        description: Data/hora da resposta convertida para timestamp.
        tests:
          - not_null
      - name: source
        description: Canal de origem padronizado em minusculas.
        tests:
          - not_null
          - accepted_values:
              values: ['web', 'mobile']

